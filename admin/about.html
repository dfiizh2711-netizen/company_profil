<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola About - Admin Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
    <aside class="admin-sidebar"></aside>

    <main class="admin-main">
        <header class="admin-header">
            <h1><i class="fas fa-info-circle"></i> Kelola About Page</h1>
            <a href="../about.html" target="_blank" class="btn btn-secondary btn-sm">
                <i class="fas fa-eye"></i> Lihat Halaman About
            </a>
        </header>

        <div class="admin-content">
            <form id="aboutForm" onsubmit="handleAboutSubmit(event)">
                <div style="display:grid; grid-template-columns: 1fr 380px; gap:1.5rem; align-items:start;">

                    <!-- LEFT: Form -->
                    <div>
                        <!-- Company History -->
                        <div class="content-card" style="margin-bottom:1.25rem;">
                            <h3><i class="fas fa-history" style="color:#3b82f6;margin-right:.5rem;"></i> Sejarah Perusahaan</h3>
                            <div class="form-group" style="margin:0;">
                                <textarea id="companyHistory" class="form-control" rows="6" required
                                          oninput="updateAboutPreview()"
                                          placeholder="Ceritakan perjalanan dan sejarah perusahaan Anda..."></textarea>
                            </div>
                        </div>

                        <!-- Vision & Mission -->
                        <div class="content-card" style="margin-bottom:1.25rem;">
                            <h3><i class="fas fa-eye" style="color:#8b5cf6;margin-right:.5rem;"></i> Visi &amp; Misi</h3>
                            <div class="form-group">
                                <label for="vision">Visi *</label>
                                <textarea id="vision" class="form-control" rows="3" required
                                          oninput="updateAboutPreview()"
                                          placeholder="Visi jangka panjang perusahaan Anda..."></textarea>
                            </div>
                            <div class="form-group" style="margin-bottom:0;">
                                <label for="mission">Misi *</label>
                                <textarea id="mission" class="form-control" rows="3" required
                                          oninput="updateAboutPreview()"
                                          placeholder="Misi dan tujuan perusahaan Anda..."></textarea>
                            </div>
                        </div>

                        <!-- Values -->
                        <div class="content-card" style="margin-bottom:1.25rem;">
                            <h3><i class="fas fa-star" style="color:#f59e0b;margin-right:.5rem;"></i> Nilai Perusahaan</h3>
                            <p style="font-size:.8rem;color:#64748b;margin-bottom:1rem;">
                                <i class="fas fa-lightbulb" style="color:#f59e0b;"></i>
                                Pisahkan setiap nilai dengan titik (.) atau baris baru. Gunakan format: <strong>Nama: Deskripsi</strong>
                            </p>
                            <div class="form-group" style="margin:0;">
                                <textarea id="companyValues" class="form-control" rows="5" required
                                          oninput="updateAboutPreview()"
                                          placeholder="Inovasi: Kami mengutamakan kreativitas&#10;Integritas: Kami membangun kepercayaan&#10;Kolaborasi: Kami bekerja bersama"></textarea>
                            </div>
                        </div>

                        <!-- Company Image -->
                        <div class="content-card" style="margin-bottom:1.25rem;">
                            <h3><i class="fas fa-image" style="color:#10b981;margin-right:.5rem;"></i> Foto Perusahaan</h3>
                            <div id="companyImageUploader"></div>
                        </div>

                        <button type="submit" class="btn btn-primary" style="width:100%;padding:1rem;font-size:1rem;">
                            <i class="fas fa-save"></i> Simpan Semua Perubahan
                        </button>
                    </div>

                    <!-- RIGHT: Live Preview -->
                    <div style="position:sticky;top:80px;">
                        <div class="content-card" style="padding:0;overflow:hidden;">
                            <div style="padding:.875rem 1.25rem;background:#1e293b;display:flex;align-items:center;gap:.75rem;">
                                <div style="display:flex;gap:5px;">
                                    <span style="width:12px;height:12px;border-radius:50%;background:#ef4444;display:block;"></span>
                                    <span style="width:12px;height:12px;border-radius:50%;background:#f59e0b;display:block;"></span>
                                    <span style="width:12px;height:12px;border-radius:50%;background:#22c55e;display:block;"></span>
                                </div>
                                <span style="color:#94a3b8;font-size:.75rem;flex:1;text-align:center;">Preview About</span>
                            </div>
                            <div style="padding:1.25rem;max-height:500px;overflow-y:auto;">
                                <!-- History preview -->
                                <div style="margin-bottom:1rem;">
                                    <p style="font-size:.65rem;font-weight:700;text-transform:uppercase;color:#94a3b8;margin-bottom:.4rem;letter-spacing:.05em;">Sejarah</p>
                                    <p id="prev_history" style="font-size:.72rem;color:#334155;line-height:1.6;"></p>
                                </div>
                                <hr style="border:none;border-top:1px solid #f1f5f9;margin:1rem 0;">
                                <!-- Vision -->
                                <div style="background:#eff6ff;border-radius:.5rem;padding:.875rem;margin-bottom:.75rem;">
                                    <p style="font-size:.6rem;font-weight:700;color:#2563eb;margin-bottom:.3rem;text-transform:uppercase;">Visi</p>
                                    <p id="prev_vision" style="font-size:.7rem;color:#1e40af;line-height:1.5;margin:0;"></p>
                                </div>
                                <!-- Mission -->
                                <div style="background:#f0fdf4;border-radius:.5rem;padding:.875rem;margin-bottom:.75rem;">
                                    <p style="font-size:.6rem;font-weight:700;color:#16a34a;margin-bottom:.3rem;text-transform:uppercase;">Misi</p>
                                    <p id="prev_mission" style="font-size:.7rem;color:#15803d;line-height:1.5;margin:0;"></p>
                                </div>
                                <!-- Values preview -->
                                <div>
                                    <p style="font-size:.65rem;font-weight:700;text-transform:uppercase;color:#94a3b8;margin-bottom:.5rem;letter-spacing:.05em;">Nilai-Nilai</p>
                                    <div id="prev_values"></div>
                                </div>
                            </div>
                            <div style="background:#f8fafc;border-top:1px solid #e2e8f0;padding:.75rem 1.25rem;text-align:center;">
                                <a href="../public/about.html" target="_blank" style="font-size:.7rem;color:#3b82f6;">
                                    <i class="fas fa-external-link-alt"></i> Buka tampilan penuh
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabaseClient.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/admin-sidebar.js"></script>
    <script src="../js/admin-main.js"></script>
    <script src="../js/image-uploader.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', async function() {
            const isAdmin = await protectAdminPage();
            if (!isAdmin) return;
            createImageUploader({ containerId:'companyImageUploader', inputId:'companyImageUrl', label:'Foto Perusahaan' });
            await loadAboutContent();
        });

        async function loadAboutContent() {
            try {
                showLoading();
                const { data: content, error } = await supabaseClient
                    .from('about_content')
                    .select('*')
                    .single();
                
                if (error) throw error;
                if (content && Object.keys(content).length > 0) {
                    document.getElementById('companyHistory').value  = content.company_history || '';
                    document.getElementById('vision').value          = content.vision || '';
                    document.getElementById('mission').value         = content.mission || '';
                    document.getElementById('companyValues').value   = content.company_values || '';
                    if (content.company_image_url) {
                        createImageUploader({ containerId:'companyImageUploader', inputId:'companyImageUrl', label:'Foto Perusahaan', currentUrl: content.company_image_url });
                    }
                    updateAboutPreview();
                }
                hideLoading();
            } catch(e) {
                hideLoading();
                showToast('Gagal memuat: ' + e.message, 'error');
            }
        }

        function updateAboutPreview() {
            const history = document.getElementById('companyHistory')?.value || '';
            const vision  = document.getElementById('vision')?.value || '';
            const mission = document.getElementById('mission')?.value || '';
            const values  = document.getElementById('companyValues')?.value || '';

            document.getElementById('prev_history').textContent = history.slice(0, 200) + (history.length > 200 ? '...' : '');
            document.getElementById('prev_vision').textContent  = vision.slice(0, 120) + (vision.length > 120 ? '...' : '');
            document.getElementById('prev_mission').textContent = mission.slice(0, 120) + (mission.length > 120 ? '...' : '');

            // Values
            const valList = values.split(/[\n.]/).filter(v => v.trim());
            document.getElementById('prev_values').innerHTML = valList.slice(0,5).map(v => {
                const parts = v.trim().split(':');
                const label = parts.length > 1 ? parts[0].trim() : v.trim();
                return `<div style="display:flex;align-items:center;gap:.4rem;margin-bottom:.35rem;">
                    <i class="fas fa-check-circle" style="color:#3b82f6;font-size:.6rem;flex-shrink:0;"></i>
                    <span style="font-size:.67rem;color:#334155;">${label}</span>
                </div>`;
            }).join('');
        }

        async function handleAboutSubmit(e) {
            e.preventDefault();
            const formData = {
                company_history:   document.getElementById('companyHistory').value,
                vision:            document.getElementById('vision').value,
                mission:           document.getElementById('mission').value,
                company_values:    document.getElementById('companyValues').value,
                company_image_url: document.getElementById('companyImageUrl')?.value || null
            };
            try {
                showLoading();
                const { error } = await supabaseClient
                    .from('about_content')
                    .update(formData)
                    .eq('id', 1); // Assuming single row with id=1
                
                if (error) throw error;
                showToast('About berhasil disimpan!', 'success');
                hideLoading();
            } catch(e) {
                hideLoading();
                showToast('Gagal: ' + e.message, 'error');
            }
        }
    </script>

    <style>
        .content-card { background: white; border-radius: .75rem; padding: 1.75rem; border: 1px solid #e2e8f0; }
        .content-card h3 { margin: 0 0 1.25rem; font-size: 1rem; color: #1e293b; }
        @media (max-width: 900px) {
            .admin-content > form > div { grid-template-columns: 1fr !important; }
        }
    </style>
</body>
</html>
